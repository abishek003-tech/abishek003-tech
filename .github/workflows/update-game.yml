name: Update Space Shooter Game

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: abishek003-tech
          output-path: game.gif
          strategy: random

      - name: Commit GIF
        uses: EndBug/add-and-commit@v9
        with:
          add: game.gif
          message: "Update GitHub Space Shooter"
